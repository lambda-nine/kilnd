# Unprivileged checks only. The kiln integration test and the end-to-end
# smoke test need root and a prepared kiln host, and are run by hand in the
# Lima VM (scripts/integration-test.sh, scripts/smoke.sh).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0
          rustc --version
          cargo clippy --version

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Shell syntax
        run: |
          git ls-files -z '*.sh' | while IFS= read -r -d '' f; do
            case $(head -n 1 "$f") in
              *bash*) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac || { echo "::error file=$f::shell syntax error"; exit 1; }
          done

      - name: Maintenance script tests
        run: python3 -I scripts/kilnd-maintenance-tests.py

      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
