# Unprivileged checks only. The kiln integration test and the end-to-end
# smoke test need root and a prepared kiln host, and are run by hand in the
# Lima VM (scripts/integration-test.sh, scripts/smoke.sh).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0
          rustc --version
          cargo clippy --version

      - name: cargo test
        run: cargo test --locked

      # -D warnings makes clippy.toml's disallowed-methods (design section 7.1's
      # destructive-action gate) an error; the explicit flag keeps that true if the
      # warnings level ever changes. Both the MSRV and the current toolchain.
      - name: cargo clippy (1.88)
        run: cargo clippy --locked --all-targets -- -D warnings -D clippy::disallowed_methods

      - name: cargo clippy (1.99)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          cargo +1.99.0 clippy --locked --all-targets -- -D warnings -D clippy::disallowed_methods

      # B6-BI-01's build boundary: the release build CI and the installers make has no
      # Firecracker flags, and refuses Daybreak's PoC command at argument parsing.
      - name: Release build refuses the Firecracker test deployment
        run: |
          cargo build --locked --release -p kilnd --bin kilnd
          sh scripts/test-deployment-gate-regressions.sh release target/release/kilnd

      - name: Shell syntax
        run: |
          git ls-files -z '*.sh' | while IFS= read -r -d '' f; do
            case $(head -n 1 "$f") in
              *bash*) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac || { echo "::error file=$f::shell syntax error"; exit 1; }
          done

      - name: Maintenance script tests
        run: python3 -I scripts/kilnd-maintenance-tests.py

      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  # The same checks with the non-default `firecracker-test-deployment` feature, which only
  # the B6 VM scripts enable: tests, clippy (the destructive-action gate) on both
  # toolchains, and the feature build's refusal of a mismatched identity (B6-BI-01).
  feature:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      FEATURES: kilnd/firecracker-test-deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0
          rustc --version
          cargo clippy --version

      - name: cargo test (feature)
        run: cargo test --locked --features "$FEATURES"

      - name: cargo clippy (feature, 1.88)
        run: cargo clippy --locked --all-targets --features "$FEATURES" -- -D warnings -D clippy::disallowed_methods

      - name: cargo clippy (feature, 1.99)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          cargo +1.99.0 clippy --locked --all-targets --features "$FEATURES" -- -D warnings -D clippy::disallowed_methods

      - name: Feature build refuses a mismatched identity
        run: |
          cargo build --locked -p kilnd --bin kilnd --features "$FEATURES"
          sh scripts/test-deployment-gate-regressions.sh feature target/debug/kilnd

  # B7 milestone 2: Daybreak's dependency-gate PoCs against the real crates and clippy
  # on both toolchains (fs-err reviewed as none and as filesystem; std::fs::copy and
  # libc::creat). It resolves fs-err from the registry in a disposable copy.
  gate-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust 1.88 and 1.99
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.88.0

      - name: Dependency gate regressions
        run: sh scripts/dependency-gate-regressions.sh 1.88.0 1.99.0
