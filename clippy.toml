  # Truncation, creation-by-truncation and whole-file overwrite (B4 recheck 5).
  { path = "std::fs::File::set_len", reason = "truncates or extends a file: approved storage items only (design 7.1)" },
  { path = "std::fs::File::create", reason = "truncates an existing file: approved items only (design 7.1)" },
