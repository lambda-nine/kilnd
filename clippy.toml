# Design section 7.1, the destructive-action invariant: these are the raw destructive,
# raw-syscall and subprocess capabilities. Clippy rejects every use (a call, or a path
# taken as a function value or alias) outside the approved modules, each of which carries
# a justified #[allow(clippy::disallowed_methods)]. CI runs clippy with -D warnings on
# Linux, and proven::tests::disallowed_allows_only_in_approved_modules rejects an allow
# anywhere else. `allow-invalid` marks paths that exist only on some targets (macOS
# libc has no umount2; Linux libc has no unmount); see design 7.1 for which resolve where.
# rustix and nix are not dependencies.
disallowed-methods = [
  # Signals.
  { path = "libc::kill", reason = "a signal: only proven.rs may signal (design 7.1)" },
  { path = "libc::killpg", reason = "a signal: only proven.rs may signal (design 7.1)" },
  { path = "libc::tgkill", reason = "a signal: only proven.rs may signal (design 7.1)", allow-invalid = true },
  { path = "libc::pidfd_send_signal", reason = "a signal: only proven.rs may signal (design 7.1)", allow-invalid = true },
  { path = "libc::syscall", reason = "a raw syscall bypasses every typed gate (design 7.1)" },
  { path = "std::process::Child::kill", reason = "a signal: only proven.rs may signal (design 7.1)" },
  { path = "tokio::process::Child::kill", reason = "a signal: only proven.rs may signal (design 7.1)" },
  { path = "tokio::process::Child::start_kill", reason = "a signal: only proven.rs may signal (design 7.1)" },
  # Removal, unmount and rename.
  { path = "libc::unlink", reason = "destructive: only proven.rs (design 7.1)" },
  { path = "libc::unlinkat", reason = "destructive: only proven.rs (design 7.1)" },
  { path = "libc::rmdir", reason = "destructive: only proven.rs (design 7.1)" },
