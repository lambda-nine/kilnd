[package]
name = "kilnd"
default-run = "kilnd"
description = "Control daemon for kiln sandboxes, serving gRPC over a Unix socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Phase 1b B6's isolated Firecracker test deployment (deploy/firecracker-test/). Without
# it the daemon has no `--backend firecracker` or `--firecracker-test-deployment` at all.
# Release and installed builds never enable it; the B6 VM scripts and CI's feature build do.
firecracker-test-deployment = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
kilnd-api.workspace = true
kilnd-exec-core.workspace = true
kilnd-broker-protocol.workspace = true
libc.workspace = true
prost.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
h2.workspace = true
tokio = { workspace = true, features = ["test-util"] }
hyper-util.workspace = true
tempfile.workspace = true
tower.workspace = true
