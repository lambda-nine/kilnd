// kilnd API, version 1.
//
// kilnd manages sandboxes on one node and serves this API over a Unix socket
// (/run/kilnd/kilnd.sock by default). Nothing here names a particular
// isolation backend: kiln is the first, and a microVM backend such as
// Firecracker should fit the same messages.
//
// Compatibility: within v1, fields and RPCs are only added, never renumbered
// or removed. Breaking changes go in a new package, kilnd.v2.
syntax = "proto3";

package kilnd.v1;

service KilndService {
  // Reports whether the daemon and its backend are usable.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Creates a sandbox and waits until it is ready for Exec. On failure the
  // sandbox is kept in SANDBOX_STATE_FAILED for inspection and an error is
  // returned.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);

  // Returns one sandbox and its most recent executions.
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);

  // Lists sandboxes, newest first.
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);

  // Removes a sandbox. A running execution in it is canceled first.
  // Deleting a deleted sandbox succeeds.
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);

  // Runs a command in a ready sandbox and waits for it. Executions in one
  // sandbox run one at a time, in arrival order. The command's own outcome
  // (any exit code, a timeout, cancellation) is a successful RPC whose
  // Execution says what happened; RPC errors mean the request was invalid or
  // the sandbox couldn't run it.
  rpc Exec(ExecRequest) returns (ExecResponse);

  // Returns one execution, including its captured output.
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);
}

message HealthRequest {}

message HealthResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The daemon is serving and the backend answered.
    STATUS_SERVING = 1;
    // The daemon is serving but the backend didn't answer; see detail.
    STATUS_DEGRADED = 2;
    // The daemon is shutting down and refuses new work.
    STATUS_SHUTTING_DOWN = 3;
  }
  Status status = 1;
  string version = 2;
  string backend = 3;
  string backend_version = 4;
  string detail = 5;
  int64 started_at_unix_ms = 6;
  // Sandboxes not yet deleted, failed or lost.
  uint32 active_sandboxes = 7;
  uint32 running_executions = 8;
}

enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  // The backend is creating it.
  SANDBOX_STATE_CREATING = 1;
  // Accepts Exec.
  SANDBOX_STATE_READY = 2;
  // DeleteSandbox is removing it.
  SANDBOX_STATE_DELETING = 3;
  // Removed. The record stays for history.
  SANDBOX_STATE_DELETED = 4;
  // Creation failed; see failure_reason. Delete it to clear the record.
  SANDBOX_STATE_FAILED = 5;
  // The backend no longer has it (host reboot, crashed shim). Delete it to
  // clear the record.
  SANDBOX_STATE_LOST = 6;
}

enum NetworkMode {
  // Same as NETWORK_MODE_NONE.
  NETWORK_MODE_UNSPECIFIED = 0;
  // Loopback only.
  NETWORK_MODE_NONE = 1;
  // Public internet; private, link-local and host addresses stay blocked.
  NETWORK_MODE_FULL = 2;
  // Only the destinations in NetworkPolicy.allow.
  NETWORK_MODE_ALLOWLIST = 3;
}

message NetworkPolicy {
  NetworkMode mode = 1;
  // With NETWORK_MODE_ALLOWLIST: HOST[:PORT] or IP[/PREFIX][:PORT].
  repeated string allow = 2;
}

// Zero means the daemon's default.
message ResourceLimits {
  uint64 memory_bytes = 1;
  // CPU in thousandths of a core: 500 is half a core.
  uint32 cpu_millis = 2;
  // Maximum processes and threads.
  uint32 pids = 3;
  // Everything the sandbox writes, blocks and inodes together.
  uint64 disk_bytes = 4;
}

message SandboxSpec {
  // Root filesystem image name. Empty means the daemon's default.
  string image = 1;
  ResourceLimits limits = 2;
  NetworkPolicy network = 3;
  // Writes are denied outside the backend's scratch paths and writable_paths.
  bool read_only_root = 4;
  // Absolute paths that stay writable with read_only_root.
  repeated string writable_paths = 5;
  // Caller-defined tags, stored and returned as given.
  map<string, string> labels = 6;
}

message Sandbox {
  string id = 1;
  SandboxState state = 2;
  // The effective spec, with defaults filled in.
  SandboxSpec spec = 3;
  // Which isolation backend runs it, like "kiln".
  string backend = 4;
  // The backend's own ID, for operators. Empty until the backend created it.
  string backend_id = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
  // Zero unless deleted.
  int64 deleted_at_unix_ms = 8;
  // Why it is FAILED or LOST, or why the last delete attempt failed.
  string failure_reason = 9;
}

message CreateSandboxRequest {
  SandboxSpec spec = 1;
}

message CreateSandboxResponse {
  Sandbox sandbox = 1;
}

message GetSandboxRequest {
  string id = 1;
  // How many recent executions to return, newest first. Zero means 10; at
  // most 100. Their output data is left out; use GetExecution for it.
  uint32 execution_limit = 2;
}

message GetSandboxResponse {
  Sandbox sandbox = 1;
  repeated Execution recent_executions = 2;
}

message ListSandboxesRequest {
  // Also return DELETED sandboxes.
  bool include_deleted = 1;
}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
}

message DeleteSandboxRequest {
  string id = 1;
}

message DeleteSandboxResponse {
  Sandbox sandbox = 1;
}

message ExecRequest {
  string sandbox_id = 1;
  // Program and arguments, passed as an argument vector, never through a
  // shell. Run `sh -c` explicitly for shell syntax.
  repeated string argv = 2;
  // Bytes for the command's standard input; empty means /dev/null.
  bytes stdin = 3;
  // Zero means the daemon's default; values above its maximum are refused.
  uint32 timeout_ms = 4;
}

message ExecResponse {
  Execution execution = 1;
}

message GetExecutionRequest {
  string id = 1;
}

message GetExecutionResponse {
  Execution execution = 1;
}

enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_RUNNING = 1;
  // The command finished; exit_code is set.
  EXECUTION_STATE_EXITED = 2;
  // The timeout passed and the command was killed.
  EXECUTION_STATE_TIMED_OUT = 3;
  // Stopped by DeleteSandbox or daemon shutdown; see failure_reason.
  EXECUTION_STATE_CANCELED = 4;
  // The backend couldn't run it; see failure_reason.
  EXECUTION_STATE_FAILED = 5;
  // The daemon stopped while it ran and found it unfinished on restart.
  EXECUTION_STATE_INTERRUPTED = 6;
}

// Captured output, cut at the daemon's per-stream limit.
message Output {
  // The first bytes of the stream, up to the limit.
  bytes data = 1;
  // How many bytes the command wrote in total.
  uint64 total_bytes = 2;
  // True when total_bytes exceeds the data kept.
  bool truncated = 3;
}

message Execution {
  string id = 1;
  string sandbox_id = 2;
  repeated string argv = 3;
  ExecutionState state = 4;
  // Set when state is EXITED: the command's exit code, or 128 + the signal
  // number if a signal killed it.
  optional int32 exit_code = 5;
  string failure_reason = 6;
  int64 started_at_unix_ms = 7;
  // Zero while running.
  int64 finished_at_unix_ms = 8;
  uint32 timeout_ms = 9;
  uint64 stdin_bytes = 10;
  Output stdout = 11;
  Output stderr = 12;
}
