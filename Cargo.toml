[workspace]
resolver = "3"
members = [
    "crates/kilnd-api",
    "crates/kilnd-broker-protocol",
    "crates/kilnd-exec-core",
    "crates/kilnd-guest-broker",
    "crates/kilnd",
    "crates/kilndctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/lambda-nine/kilnd"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive", "env"] }
hyper-util = { version = "0.1", features = ["tokio"] }
h2 = "0.4"
libc = "0.2.170"
prost = "0.14"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.47", features = ["rt", "net", "process", "time", "signal", "io-util", "sync", "macros", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "server", "channel"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
kilnd-api = { path = "crates/kilnd-api" }
kilnd-broker-protocol = { path = "crates/kilnd-broker-protocol" }
kilnd-exec-core = { path = "crates/kilnd-exec-core" }

# The helper hashes its own image and every approved artifact when it starts and on
# each Create. Unoptimized SHA-256 runs at about 5 MiB/s on the dev VM (71 MiB in 13.9 s,
# against 0.68 s at opt-level 3), which pushed the debug test helper past its fixtures'
# 30-second start (Phase 1b B7). Optimizing this one dependency in debug and test builds
# keeps them representative; release builds are unchanged.
[profile.dev.package.sha2]
opt-level = 3

# Phase 1b B7: the library tests scripts/b4-vm-tests.sh installs as a real helper. kilnd
# itself stays a debug build with its overflow checks; every dependency is optimized,
# because a real helper hashes its own image and parses the bundle's 33 MB manifest at
# start and in every Preflight, which unoptimized sha2 and serde_json made slower than
# the wire deadlines on a loaded host.
[profile.vm-test]
inherits = "dev"

[profile.vm-test.package."*"]
opt-level = 2
