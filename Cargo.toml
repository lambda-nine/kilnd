[workspace]
resolver = "3"
members = ["crates/kilnd-api", "crates/kilnd", "crates/kilndctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/lambda-nine/kilnd"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive", "env"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2.170"
prost = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.47", features = ["rt", "net", "process", "time", "signal", "io-util", "sync", "macros", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "server", "channel"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
kilnd-api = { path = "crates/kilnd-api" }
